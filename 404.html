  /* the Konpo dance; the static mark holds the spot until (or instead of) the lottie */
  .mark { position: relative; width: 44rem; height: 44rem; margin: -17rem 0 -16rem; pointer-events: none; }
  .mark > svg, .mark .slot { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mark > svg path { fill: var(--purple-vivid); }
  .mark.live > svg { visibility: hidden; }
  .slot [fill="rgb(20,20,20)"] { fill: var(--bg); }   /* the center circle cuts the dots against the page */
  h1 { font-size: 3.2rem; font-weight: 400; line-height: 1.1; }
  a {

    color: var(--on-ink); background: var(--white); border: 1px solid var(--white);
    border-radius: 200rem; padding: 0.8rem 1.6rem; text-decoration: none;
    transition: opacity .3s;
  }
  a:hover { opacity: 0.85; }
  a:focus-visible { outline: 2px solid var(--purple-vivid); outline-offset: 3px; }
  body > * { opacity: 0; filter: blur(8px); animation: in .6s ease forwards; }
  h1 { animation-delay: .12s; } a { animation-delay: .24s; }
  @keyframes in { to { opacity: 1; filter: blur(0); } }
  @media (prefers-reduced-motion: reduce) { body > * { animation: none; opacity: 1; filter: none; } }

<script>
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const box = document.getElementById('mark');
    const sc = document.createElement('script');
