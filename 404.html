<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found | Symbol Shelter</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cstyle%3Ecircle%7Bfill:%230a0a0a%7D@media(prefers-color-scheme:dark)%7Bcircle%7Bfill:%23fff%7D%7D%3C/style%3E%3Ccircle cx='50' cy='50' r='32'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  html { font-size: 62.5%; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000;
    --tile: #141414;
    --white: #fff;
    --body: rgba(255,255,255,0.70);
    --fade: #858585;
    --line: rgba(255,255,255,0.10);
    --purple-vivid: #ad9cff;
    --sans: "Neue Haas Display Pro", Arial, "Helvetica Neue", Helvetica, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, monospace;
  }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center; padding: 1.6rem;
    background: var(--bg); color: var(--white); font-family: var(--sans);
  }
  .card {
    position: relative; width: min(35rem, 100%); aspect-ratio: 1;
    background: var(--tile); border-radius: 2rem;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 1.6rem 1.8rem;
    opacity: 0; scale: 0.88; animation: in .6s cubic-bezier(0.22, 1, 0.36, 1) .1s forwards;
  }
  @keyframes in { 60% { opacity: 1; } to { opacity: 1; scale: 1; } }
  .idx { font-family: var(--mono); font-size: 1.3rem; font-weight: 300; letter-spacing: 0.08em; color: var(--fade); }
  .ring {
    position: absolute; left: 0; right: 0; top: 19%; margin: 0 auto; width: 30%; aspect-ratio: 1;
    border: 1px dashed var(--line); border-radius: 50%;
  }
  .foot { display: flex; flex-direction: column; gap: 0.8rem; }
  h1 { font-size: 2.4rem; font-weight: 400; line-height: 1.1; }
  p { font-size: 1.4rem; line-height: 1.45; color: var(--body); }
  a {
    align-self: flex-start; margin-top: 0.4rem;
    font-family: var(--mono); font-size: 1.2rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--white); text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 0.2rem;
    transition: color .3s;
  }
  a:hover { color: var(--purple-vivid); }
  a:focus-visible { outline: 2px solid var(--purple-vivid); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: 1; scale: 1; } }
</style>
</head>
<body>
  <main class="card">
    <span class="idx">SYM-404</span>
    <div class="ring" aria-hidden="true"></div>
    <div class="foot">
      <h1>Nothing sheltered here</h1>
      <p>No mark lives at this address. It may have moved, or it never made it in.</p>
      <a href="/">Back to the shelter</a>
    </div>
  </main>
</body>
</html>
